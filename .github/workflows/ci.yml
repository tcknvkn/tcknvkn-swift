name: CI

on:
  push:
    branches:
      - release
    tags:
      - "v*"
  pull_request:
    branches:
      - release

permissions:
  contents: write
  deployments: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test

      - name: Build package
        run: swift build -c release

  verify-tag-on-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.tag-bicimi.outputs.is_stable }}
      is_beta: ${{ steps.tag-bicimi.outputs.is_beta }}

    steps:
      # Etiket bicimi kapisi — on surumun kararli kanala sizmasini engeller.
      # GitHub Actions `if:` ifadelerinde regex yoktur; siniflandirma burada
      # yapilir ve yayin isleri yalnizca bu ciktilara bakar.
      #   vX.Y.Z         -> kararli
      #   vX.Y.Z-<onek>  -> on surum (-alpha, -beta, -rc, -preview, -dev ...)
      #   digerleri      -> FAIL (hicbir kanala gitmez)
      - name: Etiket bicimini siniflandir
        id: tag-bicimi
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            echo "Kararli surum etiketi: $TAG"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            echo "On surum etiketi: $TAG"
          else
            echo "::error::Gecersiz etiket bicimi: $TAG"
            echo "Beklenen: vX.Y.Z (kararli) veya vX.Y.Z-<onek> (on surum)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is on release branch
        run: |
          git fetch origin release --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/release"

  release-beta:
    if: needs.verify-tag-on-release.outputs.is_beta == 'true'
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: swift-beta

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build package
        run: swift build -c release

      - name: Archive package files
        run: tar -czf tcknvkn-swift-${{ github.ref_name }}.tar.gz Sources tests examples Package.swift README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-swift-${{ github.ref_name }}
          path: tcknvkn-swift-${{ github.ref_name }}.tar.gz

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: false
          body: |
            Swift için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi beta sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/swift
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #swift #ios #tcknvkn #tcuret #vknuret

  release-stable:
    if: needs.verify-tag-on-release.outputs.is_stable == 'true'
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: swift-production

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build package
        run: swift build -c release

      - name: Archive package files
        run: tar -czf tcknvkn-swift-${{ github.ref_name }}.tar.gz Sources tests examples Package.swift README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-swift-${{ github.ref_name }}
          path: tcknvkn-swift-${{ github.ref_name }}.tar.gz

      - name: Cleanup beta tag, release and deployments
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const betaTag = "v0.0.1-beta.1";

            try {
              const betaRelease = await github.rest.repos.getReleaseByTag({ owner, repo, tag: betaTag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: betaRelease.data.id });
              core.info(`Deleted beta release: ${betaTag}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info(`Beta release not found: ${betaTag}`);
            }

            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${betaTag}` });
              core.info(`Deleted beta tag: ${betaTag}`);
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) {
                throw error;
              }
              core.info(`Beta tag not found: ${betaTag}`);
            }

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment: "swift-beta", per_page: 100 }
            );

            for (const deployment of deployments) {
              const statuses = await github.paginate(
                github.rest.repos.listDeploymentStatuses,
                { owner, repo, deployment_id: deployment.id, per_page: 100 }
              );

              const isInactive = statuses.some((status) => status.state === "inactive");
              if (!isInactive) {
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  auto_inactive: true
                });
              }

              await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: deployment.id });
              core.info(`Deleted beta deployment: ${deployment.id}`);
            }

      - name: Create production release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: false
          body: |
            Swift için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi kararlı sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/swift
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #swift #ios #tcknvkn #tcuret #vknuret

  # Golden dataset tcknvkn/spec reposundan kopyalanmistir; ELLE DUZENLENMEZ.
  # Kopyalanan dosya zamanla sessizce ayrisir - biri duzeltilir, on sekizi eski
  # kalir. Bu kapi farki merge aninda yakalar.
  #
  # Dataset guncellendiginde: once tcknvkn/spec reposunda yeni surum etiketlenir,
  # sonra buradaki dosya ve asagidaki hash birlikte guncellenir.
  golden-dataset:
    runs-on: ubuntu-latest
    env:
      # tcknvkn/spec @ spec-v1.0.0
      GOLDEN_SHA256: e472cca15d825160877053da1e6e7078e8c1c18ef32fa25f5abb100bef217df9
    steps:
      - uses: actions/checkout@v4

      - name: Kopya kanonik surumle ayni mi
        run: |
          if ! echo "${GOLDEN_SHA256}  tests/golden-dataset.json" | sha256sum -c - ; then
            echo "::error::tests/golden-dataset.json kanonik surumden farkli."
            echo "beklenen: ${GOLDEN_SHA256}"
            echo "bulunan : $(sha256sum tests/golden-dataset.json | awk '{print $1}')"
            echo "kanonik kaynak: https://github.com/tcknvkn/spec (spec-v1.0.0)"
            exit 1
          fi
